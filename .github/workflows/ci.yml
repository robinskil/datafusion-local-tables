name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The io_uring backend only exists on Linux, and only a real kernel can
  # exercise it. Its tests skip themselves where io_uring is unavailable, so
  # this job is the only place the reactor actually runs.
  uring:
    name: io_uring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uname -r
      - run: cargo test -p localtables-format --all-features io::uring -- --nocapture

  # A short run per target on every change. This is a smoke test, not a
  # campaign: it catches a panic a change introduces, and finds little else.
  # A real hunt needs hours and a corpus that persists between runs.
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in frame segment_meta segment_read wal_record batch_decode; do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=4096
          done

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets
